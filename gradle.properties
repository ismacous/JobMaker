org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# Moteur d'inference natif (llama.cpp)
# ---------------------------------------------------------------------------
# Tag de la release llama.cpp compilee avec l'application. Le code JNI de
# app/src/main/cpp/llama_jni.cpp est ecrit pour l'API de cette version.
# Si la compilation native echoue apres une mise a jour, remettre ce tag.
jobmaker.llamaTag=b6100

# Jeu d'instructions ARM cible. Le Snapdragon 8 Elite du S25 Ultra supporte
# dotprod + i8mm + fp16, ce qui accelere fortement les matmuls quantifies.
jobmaker.armArch=armv8.2-a+dotprod+i8mm+fp16

# Backend OpenCL (GPU Adreno). Plus rapide mais compilation plus fragile :
# a n'activer qu'apres avoir reussi une premiere compilation CPU.
jobmaker.opencl=false

# Mettre a true pour ne PAS compiler llama.cpp (build de l'UI uniquement,
# utile pour iterer vite sur l'interface). L'app fonctionne alors sans IA.
jobmaker.skipNative=false
